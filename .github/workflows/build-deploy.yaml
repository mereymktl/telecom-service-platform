name: "Build & Deploy"
on:
  push:
    branches: [main]
    paths: ["app/**", "kubernetes/app/**"]
permissions:
  id-token: write
  contents: read
env:
  APP_NAME: "multi-cloud-app"
  AWS_REGION: "eu-west-1"
jobs:
  build-push:
    name: "Build & Push"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        registry:
          - { name: aws, url: "454690830753.dkr.ecr.eu-west-1.amazonaws.com" }
          #- { name: gcp, url: "europe-west1-docker.pkg.dev/cloud-prod-503017/multi-cloud-app" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Image Tag
        id: tag
        run: echo "tag=$(date +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials (OIDC)
        if: matrix.registry.name == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: matrix.registry.name == 'aws'
        uses: aws-actions/amazon-ecr-login@v2

      #- name: Configure GCP Credentials (OIDC)
       # if: matrix.registry.name == 'gcp'
        #id: gcp-auth
        #uses: google-github-actions/auth@v2
        #with:
         # workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          #service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      #- name: Login to GCP Artifact Registry
       # if: matrix.registry.name == 'gcp'
        #uses: docker/login-action@v3
        #with:
         # registry: europe-west1-docker.pkg.dev
          #username: oauth2accesstoken
          #password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: app/
          push: true
          tags: |
            ${{ matrix.registry.url }}/${{ env.APP_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ matrix.registry.url }}/${{ env.APP_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ matrix.registry.url }}/${{ env.APP_NAME }}:${{ steps.tag.outputs.tag }}"
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

  deploy-aws:
    name: "Deploy to AWS EKS"
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name multi-cloud-aws --region ${{ env.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          kubectl set image deployment/multi-cloud-app \
            app=454690830753.dkr.ecr.eu-west-1.amazonaws.com/multi-cloud-app:latest \
            --namespace=default --record
          kubectl rollout status deployment/multi-cloud-app --namespace=default --timeout=5m

