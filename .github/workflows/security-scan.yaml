name: "Security Scan"
on:
  pull_request:
    paths: ["terraform/**", "kubernetes/**", "app/**"]
  schedule:
    - cron: "0 6 * * 1"
jobs:
  trivy-fs:
    name: "Trivy Filesystem Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with: { scan-type: fs, scan-ref: app/, scanners: "vuln,secret,misconfig", severity: "HIGH,CRITICAL", format: sarif, output: trivy-fs.sarif, exit-code: 0 }
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy-fs.sarif, category: trivy-fs }
        continue-on-error: true
  trivy-k8s:
    name: "Trivy K8s Config Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with: { scan-type: config, scan-ref: kubernetes/, scanners: misconfig, severity: "HIGH,CRITICAL", exit-code: 1 }
  checkov:
    name: "Checkov IaC Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@master
        with: { directory: terraform/, framework: terraform, soft_fail: false, download_external_modules: true }
