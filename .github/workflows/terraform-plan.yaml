name: "Terraform Plan"
on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform-plan.yaml"]
permissions:
  id-token: write
  contents: read
  pull-requests: write
env:
  TF_VERSION: "1.7.0"
  TG_VERSION: "0.55.0"
  AWS_REGION: "eu-west-1"
jobs:
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [aws]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v2
        with:
          terragrunt_version: ${{ env.TG_VERSION }}

      - name: Configure AWS Credentials (OIDC)
        if: matrix.environment == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: terraform-plan
          aws-region: ${{ env.AWS_REGION }}

      #- name: Configure GCP Credentials (OIDC)
      #  if: matrix.environment == 'gcp'
      #  uses: google-github-actions/auth@v2
      #  with:
      #    workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      #    service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terragrunt Plan
        working-directory: terraform/${{ matrix.environment }}
        run: terragrunt run-all plan --terragrunt-non-interactive -no-color 2>&1 | tee plan-output.txt
        env:
          TF_IN_AUTOMATION: "true"

      - name: Post Plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/${{ matrix.environment }}/plan-output.txt', 'utf8');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: '## Terraform Plan: ${{ matrix.environment }}\n```\n' + plan.slice(0, 50000) + '\n```',
            });
