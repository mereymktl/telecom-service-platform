---
- name: Install security tools
  apt:
    name: ["aide", "auditd", "rkhunter", "lynis"]
    state: present

- name: Configure kernel parameters
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { name: net.ipv4.tcp_syncookies, value: "1" }
    - { name: net.ipv4.ip_forward, value: "1" }
    - { name: net.ipv4.conf.all.rp_filter, value: "1" }
    - { name: fs.inotify.max_user_watches, value: "524288" }

- name: Secure sensitive files
  file:
    path: "{{ item.path }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/passwd, owner: root, group: root, mode: "0644" }
    - { path: /etc/shadow, owner: root, group: shadow, mode: "0640" }
    - { path: /etc/ssh/sshd_config, owner: root, group: root, mode: "0600" }

- name: Run Lynis audit
  shell: lynis audit system --quick
  register: lynis_output
  ignore_errors: true
  changed_when: false
