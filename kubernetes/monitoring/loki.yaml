# Loki Helm values (distributed mode)
# helm install loki grafana/loki -f values.yaml -n monitoring

loki:
  auth_enabled: false
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage_config:
    tsdb_shipper:
      active_index_directory: /data/loki/tsdb-index
      cache_location: /data/loki/tsdb-cache
    aws:
      s3: "s3://eu-west-1"
      bucketnames: mereys-loki-logs-multi-cloud
      region: eu-west-1
  ingester:
    chunk_encoding: snappy
    max_chunk_age: 2h
    chunk_idle_period: 30m
  limits_config:
    retention_period: 30d
    max_entries_limit_per_query: 5000
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    allow_structured_metadata: true

write:
  replicas: 2
  persistence:
    size: 10Gi

read:
  replicas: 2
  persistence:
    size: 10Gi

backend:
  replicas: 2
  persistence:
    size: 20Gi

singleBinary:
  replicas: 0

gateway:
  enabled: true
  replicas: 2

monitoring:
  serviceMonitor:
    enabled: true